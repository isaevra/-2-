<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Мой день</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d1320;        /* основа: графит с синевой */
  --slab:#151d2d;       /* поверхность карточек */
  --slab2:#1c2638;      /* поля, вложенные блоки */
  --line:rgba(160,185,230,.10);
  --tx:#e9eef8;
  --mut:#8592aa;
  --blue:#4d8dff;       /* основной акцент */
  --amber:#f2b84b;      /* мысли */
  --green:#3dd68c;      /* привычки */
  --violet:#a08cff;     /* финансы */
  --red:#ff6b6b;
  --r-card:18px; --r-sheet:26px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--tx);color-scheme:dark}
body{font:500 15px/1.45 Manrope,system-ui,sans-serif;min-height:100vh;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.app{max-width:520px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 96px)}
.disp{font-family:Unbounded,Manrope,sans-serif;letter-spacing:-.01em}
.mut{color:var(--mut)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.hidden{display:none!important}

/* шапка раздела */
.vhead{display:flex;align-items:center;gap:12px;margin:6px 0 16px}
.vhead h1{font:700 22px/1.15 Unbounded,sans-serif;margin:0;letter-spacing:-.015em}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--slab);display:grid;place-items:center;border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}
.addbtn{height:40px;padding:0 14px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.addbtn svg{width:18px;height:18px}

/* главная: карбоновая шапка */
.hero{position:relative;border-radius:24px;padding:20px 18px 18px;overflow:hidden;margin-bottom:14px;
  background:
   linear-gradient(160deg,rgba(77,141,255,.20),rgba(13,19,32,0) 60%),
   repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 6px,rgba(0,0,0,.0) 6px 12px),
   repeating-linear-gradient(-45deg,rgba(255,255,255,.025) 0 6px,rgba(0,0,0,0) 6px 12px),
   #121a29;border:1px solid var(--line)}
.hero .greet{color:var(--mut);font-weight:600}
.hero .date{font:700 44px/1 Unbounded,sans-serif;letter-spacing:-.03em;margin:8px 0 4px}
.hero .wd{font-weight:600;font-size:16px}
.hero .gear{position:absolute;top:14px;right:14px;background:rgba(13,19,32,.55)}
.dial{position:absolute;right:18px;bottom:16px;width:96px;height:96px}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:700 20px/1 Unbounded,sans-serif}
.dial .val small{display:block;font:600 11px/1.2 Manrope;color:var(--mut);margin-top:4px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--slab);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left}
.stat b{display:block;font:700 17px/1.2 Unbounded,sans-serif;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12.5px;color:var(--mut);font-weight:600}

.card{background:var(--slab);border:1px solid var(--line);border-radius:var(--r-card);padding:14px;margin-bottom:12px}
.card h2{font:700 15px/1.2 Manrope,sans-serif;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .mut{font-weight:600}
.card h2 a{margin-left:auto;font-size:13px;color:var(--blue);text-decoration:none;font-weight:700}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
.empty button{color:var(--blue);font-weight:700}

/* строки дел и событий */
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.card h2+.item,.dayhdr+.item{border-top:0}
.item .t{flex:1;min-width:0}
.item .t .ttl{font-weight:600;overflow-wrap:anywhere}
.item .t .sub{font-size:12.5px;color:var(--mut);margin-top:1px}
.item.done .ttl{color:var(--mut);text-decoration:line-through}
.chk{width:26px;height:26px;border-radius:9px;border:2px solid #3a4862;flex:none;display:grid;place-items:center;transition:background .15s,border-color .15s}
.chk svg{width:16px;height:16px;opacity:0;transform:scale(.4);transition:.18s}
.item.done .chk{background:var(--blue);border-color:var(--blue)}
.item.done .chk svg{opacity:1;transform:none}
.time{flex:none;min-width:52px;height:26px;border-radius:8px;background:rgba(77,141,255,.14);color:#9cc0ff;font-weight:700;font-size:13px;display:grid;place-items:center;padding:0 6px}
.prio{width:8px;height:8px;border-radius:50%;flex:none}
.p1{background:var(--amber)} .p2{background:var(--red)}
.bell{width:15px;height:15px;color:var(--mut);vertical-align:-2px}

/* быстрая мысль */
.quick{display:flex;gap:8px;align-items:flex-end}
.quick textarea{flex:1;min-height:46px;max-height:140px;resize:none;border-radius:14px;background:var(--slab2);border:1px solid var(--line);padding:12px;outline:none}
.quick textarea:focus{border-color:rgba(242,184,75,.6)}
.quick button{height:46px;width:46px;border-radius:14px;background:var(--amber);color:#2a1d00;display:grid;place-items:center;flex:none}
.quick button svg{width:20px;height:20px}

/* мысли */
.search{width:100%;height:44px;border-radius:14px;background:var(--slab);border:1px solid var(--line);padding:0 14px;outline:none;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:999px;background:var(--slab);border:1px solid var(--line);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--tx);color:var(--ink);border-color:var(--tx)}
.thought{background:var(--slab);border:1px solid var(--line);border-left:3px solid rgba(242,184,75,.55);border-radius:6px 16px 16px 6px;padding:12px 12px 10px 14px;margin-bottom:8px}
.thought.pin{border-left-color:var(--amber);background:linear-gradient(90deg,rgba(242,184,75,.07),transparent 50%),var(--slab)}
.thought p{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.thought .tag{color:var(--amber);font-weight:700}
.thought .meta{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--mut)}
.thought .meta button{width:32px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--mut)}
.thought .meta button svg{width:17px;height:17px}
.thought.pin .meta .pinb{color:var(--amber)}

/* привычки */
.weekhead{display:grid;grid-template-columns:1fr repeat(7,30px);gap:4px;font-size:11.5px;color:var(--mut);font-weight:700;text-align:center;padding:0 14px 6px}
.weekhead .today{color:var(--green)}
.habit{background:var(--slab);border:1px solid var(--line);border-radius:var(--r-card);padding:12px 14px 10px;margin-bottom:8px}
.habit .hn{display:flex;align-items:center;gap:12px;min-width:0;text-align:left;width:100%}
.hdots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.hd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--mut);font-weight:700}
.hd.today{color:var(--green)}
.habit .em{font-size:22px;width:36px;height:36px;border-radius:11px;background:var(--slab2);display:grid;place-items:center;flex:none}
.habit .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.habit .st{font-size:12px;color:var(--mut);font-weight:600}
.habit .st b{color:var(--green)}
.dot{width:32px;height:32px;border-radius:50%;border:2px solid #2d3a52;justify-self:center;transition:.15s}
.dot.on{background:var(--green);border-color:var(--green);box-shadow:0 0 0 3px rgba(61,214,140,.15)}
.dot.today{border-color:#557}
.dot.today.on{border-color:var(--green)}
.hchips{display:flex;flex-wrap:wrap;gap:6px}
.hchip{height:38px;padding:0 12px 0 8px;border-radius:12px;background:var(--slab2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.hchip.on{background:rgba(61,214,140,.16);border-color:rgba(61,214,140,.5);color:#bff3d9}

/* календарь */
.cal{background:var(--slab);border:1px solid var(--line);border-radius:22px;padding:12px 10px 10px;margin-bottom:12px}
.calhead{display:flex;align-items:center;padding:0 4px 8px}
.calhead .disp{font-size:16px;font-weight:700;flex:1;text-transform:capitalize}
.calhead button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mut)}
.calhead button svg{width:20px;height:20px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wdn{font-size:11.5px;text-align:center;color:var(--mut);font-weight:700;padding:4px 0}
.day{aspect-ratio:1/1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:15px;position:relative}
.day.out{color:#3e4a61}
.day.we{color:#b9c3d6}
.day.today{color:var(--blue)}
.day.sel{background:var(--blue);color:#fff}
.day .dots{display:flex;gap:3px;height:5px;margin-top:3px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--blue)}
.day .dots i.tk{background:var(--mut)}
.day.sel .dots i{background:#fff}
.seg{display:flex;background:var(--slab2);border-radius:12px;padding:3px;gap:3px}
.seg label{flex:1}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:8px 6px;border-radius:9px;font-weight:700;font-size:14px;color:var(--mut)}
.seg input:checked+span{background:var(--slab);color:var(--tx);box-shadow:0 1px 0 rgba(255,255,255,.04)}
.seg input:focus-visible+span{outline:2px solid var(--blue)}

/* финансы */
.money-top{border-radius:22px;padding:16px;margin-bottom:12px;border:1px solid var(--line);
  background:linear-gradient(150deg,rgba(160,140,255,.20),rgba(160,140,255,0) 55%),var(--slab)}
.mswitch{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.mswitch .disp{font-size:14px;flex:1;text-transform:capitalize}
.mswitch button{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--mut)}
.mswitch button svg{width:18px;height:18px}
.bal{font:700 32px/1.1 Unbounded,sans-serif;letter-spacing:-.02em}
.bal.neg{color:var(--red)}
.io{display:flex;gap:18px;margin-top:10px;font-weight:600;font-size:14px}
.io .in{color:var(--green)} .io .out{color:#ffa3a3}
.bars .b{margin:10px 0}
.bars .bl{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:5px}
.bars .bt{height:8px;border-radius:5px;background:var(--slab2);overflow:hidden}
.bars .bt i{display:block;height:100%;border-radius:5px;background:var(--violet)}
.dayhdr{font-size:13px;color:var(--mut);font-weight:700;margin:12px 2px 4px}
.op .ic{width:36px;height:36px;border-radius:11px;background:var(--slab2);display:grid;place-items:center;font-size:18px;flex:none}
.op .sum{font-weight:700;white-space:nowrap}
.op .sum.in{color:var(--green)}

/* таббар */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 10px calc(var(--safe-b) + 8px);
  background:rgba(13,19,32,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabs nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:700;color:var(--mut);border-radius:12px}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--tx)}
.tab.on[data-v=home] svg,.tab.on[data-v=plan] svg{color:var(--blue)}
.tab.on[data-v=thoughts] svg{color:var(--amber)}
.tab.on[data-v=habits] svg{color:var(--green)}
.tab.on[data-v=money] svg{color:var(--violet)}

/* шторка */
.sheet-wrap{position:fixed;inset:0;z-index:50;pointer-events:none}
.backdrop{position:absolute;inset:0;background:rgba(3,6,12,.6);opacity:0;transition:opacity .22s}
.sheet{visibility:hidden;position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:88vh;overflow:auto;background:#141b2a;border-radius:var(--r-sheet) var(--r-sheet) 0 0;border:1px solid var(--line);border-bottom:0;
  padding:8px 18px calc(var(--safe-b) + 18px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
.sheet-wrap.open{pointer-events:auto}
.sheet-wrap.open .backdrop{opacity:1}
.sheet-wrap.open .sheet{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:3px;background:#34405a;margin:4px auto 12px}
.sheet h3{font:700 19px/1.2 Unbounded,sans-serif;margin:0 0 14px}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:13px;color:var(--mut);font-weight:700;margin-bottom:6px}
.inp{width:100%;height:48px;border-radius:14px;background:var(--slab2);border:1px solid var(--line);padding:0 14px;outline:none}
textarea.inp{height:auto;min-height:90px;padding:12px 14px;resize:vertical}
.inp:focus{border-color:rgba(77,141,255,.7)}
.inp.big{font:700 26px/1 Unbounded,sans-serif;height:60px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{position:relative}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick span{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:12px;background:var(--slab2);border:1px solid var(--line);font-weight:600;font-size:14px}
.pick input:checked+span{background:rgba(77,141,255,.18);border-color:var(--blue);color:#cfe0ff}
.pick input:focus-visible+span{outline:2px solid var(--blue)}
.pick.emo span{width:46px;justify-content:center;font-size:22px;padding:0}
.btn{width:100%;height:52px;border-radius:15px;background:var(--blue);color:#fff;font-weight:800;font-size:16px;margin-top:6px}
.btn.ghost{background:transparent;color:var(--red);height:46px;margin-top:4px}
.btn.ghost.sure{background:rgba(255,107,107,.14)}
.btn.sec{background:var(--slab2);color:var(--tx)}
.hint{font-size:12.5px;color:var(--mut);margin:-4px 0 12px}

.scopebar{margin:0 0 14px}
.sw{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:14px;background:var(--slab2);border:1px solid var(--line);font-weight:600}
.sw input{width:20px;height:20px;accent-color:var(--blue);margin:0}
.members{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.locked{text-align:center;padding:60px 20px}
.locked h1{font:700 22px/1.2 Unbounded,sans-serif;margin:0 0 12px}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 86px);transform:translate(-50%,20px);opacity:0;z-index:60;
  background:#e9eef8;color:#0d1320;border-radius:14px;padding:10px 10px 10px 14px;font-weight:700;display:flex;align-items:center;gap:12px;transition:.2s;pointer-events:none;max-width:92vw}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--blue);font-weight:800;padding:4px 8px}

.view{animation:vin .22s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app" id="view" aria-live="polite"></main>

<div class="tabs"><nav id="tabs">
  <button class="tab" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Главная</button>
  <button class="tab" data-v="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M8 14l2.5 2.5L16 12"/></svg>План</button>
  <button class="tab" data-v="thoughts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21.5h4M12 2.5a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V18h6v-.8c0-.8.4-1.5 1-2A7 7 0 0 0 12 2.5z"/></svg>Мысли</button>
  <button class="tab" data-v="habits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4.4 0 7.5-3 7.5-7.2 0-4.6-4-7.3-5-12.3-2.5 2-4 4.8-3.8 7.8-1.3-.7-2.2-2-2.4-3.3C6.400 8.700 4.500 11.500 4.500 14.800 4.500 19 7.600 22 12 22z"/></svg>Привычки</button>
  <button class="tab" data-v="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18v4"/><path d="M3 7.5V18a2.5 2.5 0 0 0 2.5 2.5H20a1 1 0 0 0 1-1V10a1 1 0 0 0-1-1H5.5A2.5 2.5 0 0 1 3 7.5z"/><circle cx="16.5" cy="14.8" r="1.3" fill="currentColor"/></svg>Финансы</button>
</nav></div>

<div class="sheet-wrap" id="sheetWrap" aria-hidden="true">
  <div class="backdrop" data-act="closeSheet"></div>
  <div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
</div>
<div class="toast" id="toast" role="status"><span id="toastTx"></span><button id="toastUndo">Вернуть</button></div>

<script>
/* ============ Telegram ============ */
const tg = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined) ? window.Telegram.WebApp : null;
const inTG = !!(tg && tg.initData);
if (tg) {
  try { tg.ready(); tg.expand(); } catch (e) {}
  try { tg.setHeaderColor('#0d1320'); tg.setBackgroundColor('#0d1320'); } catch (e) {}
  try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
}
const hap = (k) => { try {
  if (!inTG) return;
  if (k === 'ok') tg.HapticFeedback.notificationOccurred('success');
  else if (k === 'sel') tg.HapticFeedback.selectionChanged();
  else tg.HapticFeedback.impactOccurred(k || 'light');
} catch (e) {} };

/* ============ Утилиты ============ */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => ymd(new Date());
const MON = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MON_G = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return (m10 === 1 && m100 !== 11) ? a : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) ? b : c; };

const dayLabel = (s) => {
  const t = today();
  if (s === t) return 'Сегодня';
  if (s === ymd(addDays(new Date(), 1))) return 'Завтра';
  if (s === ymd(addDays(new Date(), -1))) return 'Вчера';
  const d = parseYmd(s);
  return `${d.getDate()} ${MON_G[d.getMonth()]}, ${WD_S[d.getDay()]}`;
};
const ago = (ts) => {
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return 'только что';
  if (m < 60) return `${m} мин назад`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} ${plural(h, 'час', 'часа', 'часов')} назад`;
  return dayLabel(ymd(new Date(ts)));
};

/* ============ Хранилище ============
   В Telegram — облако Telegram (CloudStorage, привязано к аккаунту, работает на всех устройствах).
   Вне Telegram — память браузера. Позже заменим на свой сервер. */
const KEY = 'myday_v1', CHUNK = 3800;
const cloudOK = () => { try { return inTG && tg.CloudStorage && tg.isVersionAtLeast('6.9'); } catch (e) { return false; } };
const Store = {
  local() { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } },
  load() {
    return new Promise((res) => {
      if (!cloudOK()) return res(this.local());
      tg.CloudStorage.getItem('n', (err, n) => {
        n = parseInt(n || '0', 10);
        if (err || !n) return res(this.local());
        const keys = Array.from({ length: n }, (_, i) => 'd' + i);
        tg.CloudStorage.getItems(keys, (e2, vals) => {
          if (e2 || !vals) return res(this.local());
          try { res(JSON.parse(keys.map(k => vals[k] || '').join(''))); } catch (e) { res(this.local()); }
        });
      });
    });
  },
  write(obj) {
    const s = JSON.stringify(obj);
    try { localStorage.setItem(KEY, s); } catch (e) {}
    if (cloudOK()) {
      const parts = [];
      for (let i = 0; i < s.length; i += CHUNK) parts.push(s.slice(i, i + CHUNK));
      let left = parts.length;
      parts.forEach((p, i) => tg.CloudStorage.setItem('d' + i, p, () => { if (--left === 0) tg.CloudStorage.setItem('n', String(parts.length)); }));
    }
  }
};
let saveT;
const save = () => { clearTimeout(saveT); saveT = setTimeout(() => Store.write(S), 300); };

/* ============ Сервер (Cloudflare) ============
   Если мини-апп открыт с нашего сервера, данные хранятся там:
   личные и общий семейный раздел. Иначе — как раньше, локально. */
let MODE = 'local', SCOPE = 'personal', SRV = null;
const PERS = () => (MODE === 'server' ? SRV.personal : S);
const COLS = ['thoughts', 'habits', 'money', 'tasks', 'events'];
const emptyS = () => ({ v: 1, name: '', currency: '₽', thoughts: [], habits: [], money: [], tasks: [], events: [] });
const isEmptyS = (st) => !st || COLS.every(c => !st[c] || !st[c].length);
async function api(action, body = {}) {
  const r = await fetch('api/' + action, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ initData: tg ? tg.initData : '', ...body }) });
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!j) throw new Error('HTTP ' + r.status);
  return j;
}
function applyServer(r) {
  SRV = r;
  for (const k of ['personal', 'family']) SRV[k] = Object.assign(emptyS(), SRV[k] || {});
  if (!SRV.personal.name) SRV.personal.name = r.me.name;
  S = SRV[SCOPE];
}
function setScopeState(st) { S = st; if (MODE === 'server') SRV[SCOPE] = st; }
const PKEY = 'myday_pending';
let pending = (() => { try { return JSON.parse(localStorage.getItem(PKEY)) || []; } catch (e) { return []; } })();
const savePending = () => { try { localStorage.setItem(PKEY, JSON.stringify(pending)); } catch (e) {} };
function persist(ops, scope = SCOPE) {
  if (MODE !== 'server') { save(); return; }
  if (!ops.length) return;
  pending.push({ scope, ops }); savePending(); flush();
}
let flushing = false, warned = false;
async function flush() {
  if (flushing || !pending.length) return;
  flushing = true;
  try {
    while (pending.length) {
      const r = await api('ops', pending[0]);
      if (!r.ok) throw new Error(r.error);
      pending.shift(); savePending();
    }
    warned = false;
  } catch (e) {
    if (!warned) { toast('Нет связи с сервером. Изменения сохранятся, когда связь появится.'); warned = true; }
    setTimeout(flush, 8000);
  } finally { flushing = false; }
}
async function refresh() {
  if (MODE !== 'server' || pending.length || flushing || document.hidden || $('#sheetWrap').classList.contains('open')) return;
  const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  try {
    const r = await api('load');
    if (!r.ok || pending.length) return;
    if (JSON.stringify([SRV.personal, SRV.family, SRV.members]) === JSON.stringify([Object.assign(emptyS(), r.personal, { name: r.personal.name || r.me.name }), Object.assign(emptyS(), r.family), r.members])) return;
    applyServer(r); render();
  } catch (e) {}
}
setInterval(refresh, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

const streak = (h) => {
  let n = 0, d = new Date();
  if (!h.done[ymd(d)]) d = addDays(d, -1);
  while (h.done[ymd(d)]) { n++; d = addDays(d, -1); }
  return n;
};
const monthSum = (mk) => {
  let inc = 0, out = 0; const cats = {};
  S.money.filter(o => o.date.startsWith(mk)).forEach(o => {
    if (o.type === 'in') inc += o.amount; else { out += o.amount; cats[o.cat] = (cats[o.cat] || 0) + o.amount; }
  });
  return { inc, out, cats };
};

  for (let i = 1; i <= dim; i++) {
    const k = `${y}-${pad(m + 1)}-${pad(i)}`, wd = new Date(y, m, i).getDay();
    const ne = S.events.some(e => e.date === k), nt = S.tasks.some(x => x.date === k && !x.done);
    cells += `<button class="day ${k === t ? 'today' : ''} ${k === UI.selDay ? 'sel' : ''} ${wd === 0 || wd === 6 ? 'we' : ''}" data-act="selDay" data-day="${k}" aria-label="${i} ${MON_G[m]}">${i}<span class="dots">${ne ? '<i></i>' : ''}${nt ? '<i class="tk"></i>' : ''}</span></button>`;
  }
  const sd = UI.selDay;
  const ev = S.events.filter(e => e.date === sd).sort(byTime);
  const tk = S.tasks.filter(x => x.date === sd).sort((a, b) => a.done - b.done || byTime(a, b));
  const inbox = S.tasks.filter(x => !x.date && !x.done);
  return `
  <div class="vhead"><h1>План</h1><span class="sp"></span>
    <button class="iconbtn" data-act="newEvent" aria-label="Новое событие" title="Событие" style="color:var(--blue)">${I.bell.replace('class="bell"', '')}</button>
    <button class="addbtn" data-act="newTask">${I.plus}Задача</button></div>
  <section class="cal">
    <div class="calhead"><span class="disp">${MON[m]} ${y}</span>
      <button data-act="calPrev" aria-label="Предыдущий месяц">${I.left}</button>
      <button data-act="calNext" aria-label="Следующий месяц">${I.right}</button></div>
    <div class="grid7">${['пн','вт','ср','чт','пт','сб','вс'].map(w => `<div class="wdn">${w}</div>`).join('')}${cells}</div>
  </section>
  <section class="card">
    <h2>${dayLabel(sd)}${sd !== t ? `<a href="#plan" data-act="selDay" data-day="${t}">К сегодня</a>` : ''}</h2>
    ${ev.map(eventRow).join('')}${tk.map(x => taskRow(x)).join('')}
    ${!ev.length && !tk.length ? `<div class="empty">Свободный день. <button data-act="newTask">Добавить задачу</button></div>` : ''}
  </section>
  <section class="card">
    <h2>Без даты <span class="mut">${inbox.length || ''}</span></h2>
    ${inbox.length ? inbox.map(x => taskRow(x)).join('') : '<div class="empty">Сюда попадают задачи без срока.</div>'}
  </section>`;
};

V.thoughts = () => {
  const tags = {};
  S.thoughts.forEach(t => (t.text.match(/#[\p{L}\p{N}_]+/gu) || []).forEach(g => tags[g.toLowerCase()] = (tags[g.toLowerCase()] || 0) + 1));
  const tagList = Object.entries(tags).sort((a, b) => b[1] - a[1]);
  return `
  <div class="vhead"><h1>Мысли</h1><span class="sp"></span><span class="mut" style="font-weight:700">${S.thoughts.length}</span></div>
  <section class="card">${quickBox()}</section>
  <input class="search" type="search" placeholder="Поиск по мыслям" value="${esc(UI.thQ)}" data-input="thQ" aria-label="Поиск">
  ${tagList.length ? `<div class="chips"><button class="chip ${!UI.thTag ? 'on' : ''}" data-act="thTag" data-tag="">Все</button>${tagList.map(([g, n]) => `<button class="chip ${UI.thTag === g ? 'on' : ''}" data-act="thTag" data-tag="${esc(g)}">${esc(g)} <span class="mut">${n}</span></button>`).join('')}</div>` : ''}
  <div id="thList">${thList()}</div>`;
};
function thList() {
  const q = UI.thQ.trim().toLowerCase();
  const list = S.thoughts.filter(t => (!UI.thTag || t.text.toLowerCase().includes(UI.thTag)) && (!q || t.text.toLowerCase().includes(q)))
    .sort((a, b) => (b.pin - a.pin) || (b.ts - a.ts));
  if (!list.length) return `<div class="empty" style="text-align:center;padding:24px 0">${S.thoughts.length ? 'Ничего не нашлось. Попробуй другое слово или тег.' : 'Пиши сюда всё, что крутится в голове: идеи, планы, выводы.'}</div>`;
  return list.map(thoughtCard).join('');
}

V.habits = () => {
  const days = Array.from({ length: 7 }, (_, i) => addDays(new Date(), i - 6));
  const t = today();
  const done = S.habits.filter(h => h.done[t]).length;
  return `
  <div class="vhead"><h1>Привычки</h1><span class="sp"></span><button class="addbtn" style="background:var(--green);color:#03231a" data-act="newHabit">${I.plus}Привычка</button></div>
  ${S.habits.length ? `
    <p class="mut" style="margin:-6px 0 14px;font-weight:600">Сегодня ${done} из ${S.habits.length}. Можно отметить и прошедшие дни.</p>
    ${S.habits.map(h => {
      const s = streak(h);
      const last30 = Array.from({ length: 30 }, (_, i) => ymd(addDays(new Date(), -i))).filter(k => h.done[k]).length;
      return `<div class="habit">
        <button class="hn" data-act="editHabit" data-id="${h.id}"><span class="em">${h.emoji}</span>
          <span style="min-width:0;flex:1"><div class="nm">${esc(h.title)}</div><div class="st">${s ? `<b>${s} ${plural(s, 'день', 'дня', 'дней')} подряд</b>` : 'серия не начата'}, ${Math.round(last30 / 30 * 100)}% за месяц</div></span></button>
        <div class="hdots">${days.map(d => { const k = ymd(d); return `<div class="hd ${k === t ? 'today' : ''}"><button class="dot ${h.done[k] ? 'on' : ''} ${k === t ? 'today' : ''}" data-act="habit" data-id="${h.id}" data-day="${k}" aria-label="${esc(h.title)}, ${d.getDate()} ${MON_G[d.getMonth()]}" aria-pressed="${!!h.done[k]}"></button>${k === t ? 'сегодня' : WD_S[d.getDay()] + ' ' + d.getDate()}</div>`; }).join('')}</div>
      </div>`;
    }).join('')}`
  : `<div class="card empty" style="text-align:center;padding:28px 16px">Начни с одной маленькой привычки, которую точно сможешь делать каждый день.<br><br><button data-act="newHabit">Добавить привычку</button></div>`}`;
};

V.money = () => {
  const mk = UI.mMonth, [y, m] = mk.split('-').map(Number);
  const ms = monthSum(mk), bal = ms.inc - ms.out;
  const cats = Object.entries(ms.cats).sort((a, b) => b[1] - a[1]);
  const max = cats.length ? cats[0][1] : 1;
  const ops = S.money.filter(o => o.date.startsWith(mk)).sort((a, b) => b.date.localeCompare(a.date));
  const groups = {}; ops.forEach(o => (groups[o.date] = groups[o.date] || []).push(o));
  return `
  <div class="vhead"><h1>Финансы</h1><span class="sp"></span><button class="addbtn" style="background:var(--violet);color:#160d3a" data-act="newOp">${I.plus}Запись</button></div>
  <section class="money-top">
    <div class="mswitch"><span class="disp">${MON[m - 1]} ${y}</span>
      <button data-act="mPrev" aria-label="Предыдущий месяц">${I.left}</button><button data-act="mNext" aria-label="Следующий месяц">${I.right}</button></div>
    <div class="mut" style="font-size:13px;font-weight:700">Остаток за месяц</div>
    <div class="bal ${bal < 0 ? 'neg' : ''}">${bal < 0 ? '−' : ''}${money(Math.abs(bal))}</div>
    <div class="io"><span class="in">+${money(ms.inc)}</span><span class="out">−${money(ms.out)}</span></div>
  </section>
  ${cats.length ? `<section class="card bars"><h2>Куда ушли деньги</h2>
    ${cats.map(([c, v]) => `<div class="b"><div class="bl"><span>${catIcon('out', c)} ${esc(c)}</span><span>${money(v)}</span></div><div class="bt"><i style="width:${Math.max(3, v / max * 100)}%"></i></div></div>`).join('')}
  </section>` : ''}
  <section class="card">
    <h2>Операции</h2>
    ${ops.length ? Object.entries(groups).map(([d, list]) => `<div class="dayhdr">${dayLabel(d)}</div>` + list.map(o => `
      <button class="item op" style="width:100%;text-align:left" data-act="editOp" data-id="${o.id}">
        <span class="ic">${catIcon(o.type, o.cat)}</span>
        <span class="t"><div class="ttl">${esc(o.cat)}</div>${o.note ? `<div class="sub">${esc(o.note)}</div>` : ''}</span>
        <span class="sum ${o.type}">${o.type === 'in' ? '+' : '−'}${money(o.amount)}</span>
      </button>`).join('')).join('')
    : `<div class="empty">В этом месяце записей нет. <button data-act="newOp">Добавить запись</button></div>`}
  </section>`;
};

/* ============ Формы в шторке ============ */

  habit: (h = {}) => `

    <form data-form="habit"><input type="hidden" name="id" value="${h.id || ''}">
      <label class="f"><span>Название</span><input class="inp" name="title" required maxlength="60" value="${esc(h.title || '')}" placeholder="Например, 10 минут английского"></label>
      <div class="f"><span>Значок</span>${radios('emoji', EMOJI.map(x => [x, x]), h.emoji || EMOJI[0], 'pick emo')}</div>
      <button class="btn" style="background:var(--green);color:#03231a">Сохранить</button>${delBtn('delHabit', h.id)}

  op: (o = {}) => {

      <div class="f">${radios('type', [['out', 'Расход'], ['in', 'Доход']], type, 'seg')}</div>
      <label class="f"><span>Сумма, ${PERS().currency}</span><input class="inp big" name="amount" inputmode="decimal" required autocomplete="off" value="${o.amount || ''}" placeholder="0"></label>
      <div class="f"><span>Категория</span><div id="catBox">${catPick(type, o.cat)}</div></div>
      <div class="two">
        <label class="f"><span>Дата</span><input class="inp" type="date" name="date" required value="${o.date || today()}"></label>
        <label class="f"><span>Комментарий</span><input class="inp" name="note" maxlength="120" value="${esc(o.note || '')}" placeholder="Необязательно"></label>

      <button class="btn" style="background:var(--violet);color:#160d3a">Сохранить</button>${delBtn('delOp', o.id)}
    </form>`;

    return `
    <h3>Настройки</h3>

      <label class="f"><span>Как к тебе обращаться</span><input class="inp" name="name" maxlength="40" value="${esc(P.name)}"></label>
      <div class="f"><span>Валюта</span>${radios('currency', [['₽', '₽ рубль'], ['$', '$ доллар'], ['€', '€ евро'], ['¥', '¥ юань']], P.currency)}</div>
      ${me ? `<div class="f"><span>Утренняя сводка в Telegram</span><div class="two">
        <label class="sw"><input type="checkbox" name="digestOn" ${me.digestOn ? 'checked' : ''}>Присылать</label>
        <input class="inp" type="time" name="digest" value="${me.digest || '08:00'}" aria-label="Время сводки"></div></div>` : ''}
      <button class="btn">Сохранить</button>
    </form>
    ${me ? `<button class="btn sec" data-act="digestNow">Прислать сводку сейчас</button>
      <div style="height:1px;background:var(--line);margin:18px 0"></div>
      <div class="f"><span>Семья</span><div class="members">${SRV.members.map(m => `<span class="chip">${esc(m.name)}${m.id === me.id ? ' (ты)' : ''}</span>`).join('')}</div></div>

const catPick = (type, val) => radios('cat', CATS[type].map(([n, e]) => [n, `${e} ${n}`]), val || CATS[type][0][0]);

/* ============ Шторка, тост ============ */
let backCb = null;
function openSheet(html) {
  $('#sheetBody').innerHTML = html;
  const w = $('#sheetWrap'); w.classList.add('open'); w.setAttribute('aria-hidden', 'false');
  setTimeout(() => { const f = $('#sheetBody input:not([type=hidden]):not([type=radio]), #sheetBody textarea'); if (f && !f.value && window.innerWidth > 700) f.focus(); }, 250);
  try { if (inTG) { tg.BackButton.show(); if (!backCb) { backCb = () => closeSheet(); tg.BackButton.onClick(backCb); } } } catch (e) {}
  hap('light');
}
function closeSheet() {
  const w = $('#sheetWrap'); w.classList.remove('open'); w.setAttribute('aria-hidden', 'true');
  try { if (inTG) tg.BackButton.hide(); } catch (e) {}
}
let toastT, undoFn = null;
function toast(text, undo) {
  $('#toastTx').textContent = text; undoFn = undo || null;
  $('#toastUndo').classList.toggle('hidden', !undo);
  $('#toast').classList.add('show'); clearTimeout(toastT);
  toastT = setTimeout(() => $('#toast').classList.remove('show'), 3500);
}
$('#toastUndo').addEventListener('click', () => { if (undoFn) { const op = undoFn(); undoFn = null; commit(op); } $('#toast').classList.remove('show'); });

/* ============ Действия ============ */
const find = (arr, id) => S[arr].find(x => x.id === id);
const removeWithUndo = (arr, id, label) => {
  const i = S[arr].findIndex(x => x.id === id); if (i < 0) return;
  const [item] = S[arr].splice(i, 1);
  closeSheet(); commit(['del', arr, id]); hap('medium');
  toast(label, () => { S[arr].splice(i, 0, item); return ['put', arr, item]; });
};
const byMe = (o) => (MODE === 'server' && SCOPE === 'family' ? Object.assign(o, { by: SRV.me.name }) : o);
function commit(...ops) { persist(ops.filter(Boolean)); render(); }

const A = {
  closeSheet,
  settings: () => openSheet(F.settings()),
  newTask: () => openSheet(F.task()),
  editTask: (d) => openSheet(F.task(find('tasks', d.id))),
  toggleTask: (d) => { const t = find('tasks', d.id); t.done = !t.done; hap(t.done ? 'ok' : 'light'); commit(['put', 'tasks', t]); },
  delTask: (d) => removeWithUndo('tasks', d.id, 'Задача удалена'),
  newEvent: () => openSheet(F.event()),
  editEvent: (d) => openSheet(F.event(find('events', d.id))),
  delEvent: (d) => removeWithUndo('events', d.id, 'Событие удалено'),
  newHabit: () => openSheet(F.habit()),
  editHabit: (d) => openSheet(F.habit(find('habits', d.id))),
  delHabit: (d) => removeWithUndo('habits', d.id, 'Привычка удалена'),
  habit: (d) => { const h = find('habits', d.id); if (h.done[d.day]) delete h.done[d.day]; else { h.done[d.day] = true; hap('ok'); } commit(['put', 'habits', h]); },
  pinThought: (d) => { const t = find('thoughts', d.id); t.pin = !t.pin; hap('sel'); commit(['put', 'thoughts', t]); },
  delThought: (d) => removeWithUndo('thoughts', d.id, 'Мысль удалена'),
  thTag: (d) => { UI.thTag = d.tag; hap('sel'); render(); },
  newOp: () => openSheet(F.op()),
  editOp: (d) => openSheet(F.op(find('money', d.id))),
  delOp: (d) => removeWithUndo('money', d.id, 'Запись удалена'),
  selDay: (d) => { UI.selDay = d.day; const s = parseYmd(d.day); UI.planMonth = new Date(s.getFullYear(), s.getMonth(), 1); hap('sel'); if (UI.view !== 'plan') go('plan'); else render(); },
  calPrev: () => { UI.planMonth = new Date(UI.planMonth.getFullYear(), UI.planMonth.getMonth() - 1, 1); render(); },
  calNext: () => { UI.planMonth = new Date(UI.planMonth.getFullYear(), UI.planMonth.getMonth() + 1, 1); render(); },
  mPrev: () => { const [y, m] = UI.mMonth.split('-').map(Number); UI.mMonth = ymd(new Date(y, m - 2, 1)).slice(0, 7); render(); },
  mNext: () => { const [y, m] = UI.mMonth.split('-').map(Number); UI.mMonth = ymd(new Date(y, m, 1)).slice(0, 7); render(); },
  exportData: async () => {
    try { await navigator.clipboard.writeText(JSON.stringify(S)); toast('Копия скопирована, сохрани её в Избранное'); }
    catch (e) { openSheet(`<h3>Резервная копия</h3><p class="hint">Выдели текст и скопируй вручную.</p><textarea class="inp" style="min-height:200px" readonly>${esc(JSON.stringify(S))}</textarea>`); }
  },
  importOpen: () => openSheet(`<h3>Восстановить из копии</h3><form data-form="import"><p class="hint">Вставь текст резервной копии. Текущие данные заменятся.</p><textarea class="inp" name="json" style="min-height:180px" required></textarea><button class="btn">Восстановить</button></form>`),
  wipe: (d, el) => {
    if (!el.classList.contains('sure')) { el.classList.add('sure'); el.textContent = 'Нажми ещё раз, чтобы удалить всё'; return; }
    setScopeState(Object.assign(emptyS(), { name: S.name, currency: S.currency }));
    closeSheet(); commit(['replace', S]); toast(MODE === 'server' && SCOPE === 'family' ? 'Данные семьи удалены' : 'Все данные удалены');
  },
  digestNow: async () => {
    try {
      const r = await api('digest');
      toast(r.ok ? 'Сводка отправлена в чат с ботом' : r.error === 'not_started' ? 'Сначала нажми Start в чате с ботом' : 'Не получилось отправить сводку');
    } catch (e) { toast('Нет связи с сервером'); }
  },
  invite: async () => {
    try {
      const r = await api('invite'); if (!r.ok) throw 0;
      openSheet(`<h3>Приглашение в семью</h3>
        <p class="hint">Ссылка одноразовая и действует 7 дней. Кто откроет её и нажмёт Start, попадёт в раздел «Семья», а свой личный раздел у него будет отдельный.</p>
        <textarea class="inp" readonly style="min-height:70px">${esc(r.link)}</textarea>
        <button class="btn" data-act="shareLink" data-link="${esc(r.link)}">Отправить в Telegram</button>
        <button class="btn sec" data-act="copyLink" data-link="${esc(r.link)}">Скопировать ссылку</button>`);
    } catch (e) { toast('Не получилось создать приглашение'); }
  },
  shareLink: (d) => {
    const u = 'https://t.me/share/url?url=' + encodeURIComponent(d.link) + '&text=' + encodeURIComponent('Присоединяйся к нашему семейному «Мой день»');
    try { tg.openTelegramLink(u); } catch (e) { A.copyLink(d); }
  },
  copyLink: async (d) => { try { await navigator.clipboard.writeText(d.link); toast('Ссылка скопирована'); } catch (e) { toast('Выдели ссылку и скопируй вручную'); } },
  migrate: () => {
    const local = window.__localData; if (!local) return closeSheet();
    SRV.personal = Object.assign(emptyS(), local, { name: local.name || SRV.me.name });
    if (SCOPE === 'personal') S = SRV.personal;
    persist([['replace', SRV.personal]], 'personal');
    closeSheet(); render(); toast('Записи перенесены на сервер');
  },
  skipMigrate: () => { try { localStorage.setItem('myday_nomigrate', '1'); } catch (e) {} closeSheet(); }
};

const FORMS = {
  thought: (fd, f) => {
    const text = (fd.get('text') || '').trim(); if (!text) return;
    const t = byMe({ id: uid(), text, pin: false, ts: Date.now() });
    S.thoughts.unshift(t);
    f.reset(); hap('ok'); commit(['put', 'thoughts', t]); toast('Мысль сохранена');
  },
  task: (fd) => {
    const o = { title: fd.get('title').trim(), date: fd.get('date') || '', time: fd.get('time') || '', prio: +fd.get('prio') || 0 };
    const id = fd.get('id');
    let it; if (id) it = Object.assign(find('tasks', id), o); else S.tasks.push(it = byMe({ id: uid(), done: false, ...o }));
    closeSheet(); hap('ok'); commit(['put', 'tasks', it]); toast(id ? 'Задача сохранена' : 'Задача добавлена');
  },
  event: (fd) => {
    const o = { title: fd.get('title').trim(), date: fd.get('date'), time: fd.get('time') || '', remind: fd.get('remind'), note: (fd.get('note') || '').trim() };
    const id = fd.get('id');
    let it; if (id) it = Object.assign(find('events', id), o); else S.events.push(it = byMe({ id: uid(), ...o }));
    closeSheet(); hap('ok'); commit(['put', 'events', it]); toast(id ? 'Событие сохранено' : 'Событие добавлено');
  },
  habit: (fd) => {
    const o = { title: fd.get('title').trim(), emoji: fd.get('emoji') || '🎯' };
    const id = fd.get('id');
    let it; if (id) it = Object.assign(find('habits', id), o); else S.habits.push(it = byMe({ id: uid(), done: {}, ...o }));
    closeSheet(); hap('ok'); commit(['put', 'habits', it]); toast(id ? 'Привычка сохранена' : 'Привычка добавлена');
  },
  op: (fd, f) => {
    const amount = parseFloat(String(fd.get('amount')).replace(/\s/g, '').replace(',', '.'));
    if (!(amount > 0)) { const a = f.querySelector('[name=amount]'); a.focus(); a.style.borderColor = 'var(--red)'; return; }
    const o = { type: fd.get('type'), amount, cat: fd.get('cat'), date: fd.get('date'), note: (fd.get('note') || '').trim() };
    const id = fd.get('id');
    let it; if (id) it = Object.assign(find('money', id), o); else S.money.push(it = byMe({ id: uid(), ...o }));
    UI.mMonth = o.date.slice(0, 7);
    closeSheet(); hap('ok'); commit(['put', 'money', it]); toast(id ? 'Запись сохранена' : 'Запись добавлена');
  },
  settings: async (fd) => {
    const P = PERS();
    P.name = (fd.get('name') || '').trim() || P.name; P.currency = fd.get('currency') || P.currency;
    persist([['meta', { name: P.name, currency: P.currency }]], 'personal');
    if (MODE === 'server') {
      try { const r = await api('profile', { digestOn: fd.get('digestOn') === 'on', digest: fd.get('digest') || '08:00' }); if (r.ok) SRV.me = r.me; }
      catch (e) { toast('Время сводки не сохранилось: нет связи'); }
    }
    closeSheet(); render(); toast('Настройки сохранены');
  },
  import: (fd) => {
    try {
      const d = JSON.parse(fd.get('json'));
      if (!d || !Array.isArray(d.tasks) || !Array.isArray(d.thoughts)) throw 0;
      setScopeState(Object.assign(emptyS(), d)); closeSheet(); commit(['replace', S]); toast('Данные восстановлены');
    } catch (e) { toast('Это не похоже на резервную копию. Проверь, что текст вставлен целиком.'); }
  }
};

/* ============ События ============ */
document.addEventListener('click', (e) => {
  const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  const tab = e.target.closest('.tab'); if (tab) { hap('sel'); go(tab.dataset.v); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.tagName === 'A') e.preventDefault();
  const fn = A[a.dataset.act]; if (fn) fn(a.dataset, a);
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target, h = FORMS[f.dataset.form]; if (h) h(new FormData(f), f);
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.input === 'thQ') { UI.thQ = t.value; $('#thList').innerHTML = thList(); }
  if (t.tagName === 'TEXTAREA' && t.closest('.quick')) { t.style.height = 'auto'; t.style.height = Math.min(140, t.scrollHeight) + 'px'; }
});
document.addEventListener('change', (e) => {
  if (e.target.name === 'type' && e.target.closest('[data-form=op]')) $('#catBox').innerHTML = catPick(e.target.value);
  if (e.target.name === 'scope' && MODE === 'server') { SCOPE = e.target.value; S = SRV[SCOPE]; hap('sel'); render(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeSheet();
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.closest('.quick')) e.target.form.requestSubmit();
});

/* ============ Навигация ============ */
const VIEWS = ['home', 'plan', 'thoughts', 'habits', 'money'];
function go(v) { if (location.hash !== '#' + v) location.hash = v; else render(); }
function render() {
  const h = location.hash.slice(1);
  const v = VIEWS.includes(h) ? h : 'home';
  const changed = v !== UI.view; UI.view = v;
  const el = $('#view');
  el.innerHTML = `<div class="${changed ? 'view' : ''}">${scopeBar()}${V[v]()}</div>`;
  document.querySelectorAll('.tab').forEach(t => { t.classList.toggle('on', t.dataset.v === v); t.setAttribute('aria-current', t.dataset.v === v ? 'page' : 'false'); });
  if (changed) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);

/* ============ Старт ============ */
async function boot() {
  if (inTG) {
    try {
      const r = await api('load', { tz: Intl.DateTimeFormat().resolvedOptions().timeZone });
      if (r.ok) {
        MODE = 'server'; applyServer(r); UI.view = ''; render(); flush();
        let skip = false; try { skip = localStorage.getItem('myday_nomigrate') === '1'; } catch (e) {}
        const local = skip ? null : await Store.load();
        if (local && local.v && !isEmptyS(local) && isEmptyS(SRV.personal)) {
          window.__localData = local;
          const n = COLS.reduce((a, c) => a + (local[c] || []).length, 0);
          openSheet(`<h3>Перенести старые записи?</h3><p class="hint" style="margin-bottom:14px">В Telegram сохранено ${n} ${plural(n, 'запись', 'записи', 'записей')} из прошлой версии. Перенести их в твой личный раздел на сервере? Если это просто примеры, нажми «Не нужно».</p>
            <button class="btn" data-act="migrate">Перенести</button><button class="btn sec" data-act="skipMigrate">Не нужно</button>`);
        }
        return;
      }
      if (r.error === 'not_member') {
        document.querySelector('.tabs').classList.add('hidden');
        $('#view').innerHTML = `<div class="locked"><h1>Это семейное приложение</h1><p class="mut">Чтобы пользоваться им, попроси владельца прислать тебе ссылку-приглашение и открой её.</p></div>`;
        return;
      }
    } catch (e) { /* сервера нет — работаем локально */ }
  }
  const d = await Store.load();
  S = d && d.v ? d : demo();
  if (!d) save();
  UI.view = '';
  render();
}
boot();
</script>
</body>
</html>
