<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Семья</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>try{var th=localStorage.getItem("myday_theme");if(th)document.documentElement.dataset.theme=th}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Темы: меняется только палитра ===== */
:root,[data-theme=violet]{
  --ink:#0c0a1a; --glow:rgba(124,92,255,.30); --glow2:rgba(70,60,210,.16);
  --slab:rgba(30,26,60,.66); --slab-hi:rgba(44,38,84,.7); --slab2:#221e40; --line:rgba(180,160,255,.13);
  --tx:#f3f1fc; --mut:#9b95bf; --dim:#5f5a85;
  --acc:#8b6cff; --acc2:#bba8ff; --acc-ink:#fff; --acc-soft:rgba(139,108,255,.20); --acc-grad:linear-gradient(135deg,#9d84ff,#6d4df2);
  --sheet:#16132c; --tabbg:rgba(13,11,28,.86);
  --sky1:#3a2d7a; --sky2:#171334; --m1:#1d1840; --m2:#2d2563; --m3:#4b3f99;
}
[data-theme=man]{
  --ink:#080c12; --glow:rgba(56,132,255,.24); --glow2:rgba(20,184,166,.10);
  --slab:rgba(20,30,44,.70); --slab-hi:rgba(30,44,64,.72); --slab2:#18222f; --line:rgba(140,180,230,.13);
  --tx:#eef3f9; --mut:#8c9bb0; --dim:#4e5d72;
  --acc:#3d8bff; --acc2:#93c0ff; --acc-ink:#fff; --acc-soft:rgba(61,139,255,.20); --acc-grad:linear-gradient(135deg,#5aa2ff,#2160e0);
  --sheet:#0f1722; --tabbg:rgba(8,12,18,.88);
  --sky1:#1c3a66; --sky2:#0b1220; --m1:#0f1a2b; --m2:#182b45; --m3:#2b4c78;
}
[data-theme=woman]{
  --ink:#14090f; --glow:rgba(255,92,168,.28); --glow2:rgba(186,104,255,.15);
  --slab:rgba(50,22,42,.64); --slab-hi:rgba(70,30,58,.7); --slab2:#331729; --line:rgba(255,170,215,.15);
  --tx:#fff1f7; --mut:#c49cb1; --dim:#7d566b;
  --acc:#ff5fa8; --acc2:#ffb3d5; --acc-ink:#fff; --acc-soft:rgba(255,95,168,.20); --acc-grad:linear-gradient(135deg,#ff82bd,#e23d8a);
  --sheet:#210f1b; --tabbg:rgba(20,9,15,.88);
  --sky1:#7a2a62; --sky2:#220d1c; --m1:#2c1024; --m2:#4d1c40; --m3:#8a3470;
}
:root{
  --blue:var(--acc); --violet:var(--acc);
  --green:#3ddc97; --amber:#ffbd4a; --red:#ff6b7a;
  --p1:#ff5f57; --p2:#ffa31a; --p3:#4c9bff; --p4:var(--dim);
  --r-card:20px; --r-sheet:26px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--ink)}
html,body{margin:0;color:var(--tx);color-scheme:dark}
body{font:500 15px/1.45 Manrope,system-ui,sans-serif;min-height:100vh;overscroll-behavior:none;
  background:radial-gradient(110% 55% at 50% -12%,var(--glow),transparent 70%),radial-gradient(70% 40% at 105% 35%,var(--glow2),transparent 70%),var(--ink);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.app{max-width:520px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 100px)}
.disp{font-family:Unbounded,Manrope,sans-serif;letter-spacing:-.01em}
.mut{color:var(--mut)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.hidden{display:none!important}

/* шапка раздела */
.vhead{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.vhead h1{font:700 26px/1.1 Unbounded,sans-serif;margin:0;letter-spacing:-.02em}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--slab);display:grid;place-items:center;border:1px solid var(--line);color:var(--tx)}
.iconbtn svg{width:20px;height:20px}
.addbtn{height:42px;padding:0 16px;border-radius:14px;background:var(--acc-grad);color:var(--acc-ink);font-weight:800;display:inline-flex;align-items:center;gap:6px;box-shadow:0 6px 18px var(--acc-soft)}
.addbtn svg{width:18px;height:18px}

/* главная: шапка с горами */
.hero{position:relative;border-radius:26px;padding:20px 18px 16px;overflow:hidden;margin-bottom:12px;min-height:214px;
  background:linear-gradient(180deg,var(--sky1),var(--sky2));border:1px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.32)}
.hero .mtn{position:absolute;left:0;right:0;bottom:0;width:100%;height:96px;pointer-events:none}
.mtn .m3{fill:var(--m3);opacity:.55}.mtn .m2{fill:var(--m2)}.mtn .m1{fill:var(--m1)}.mtn .snow{fill:#fff;opacity:.55}.mtn .st{fill:#fff}
.hero>*:not(.mtn){position:relative}
.hero .greet{color:rgba(255,255,255,.78);font-weight:600}
.hero .date{font:700 46px/1 Unbounded,sans-serif;letter-spacing:-.035em;margin:10px 0 4px}
.hero .wd{font-weight:600;font-size:16px;color:rgba(255,255,255,.9)}
.hero .hsub{font-size:13px;margin-top:44px;color:rgba(255,255,255,.72);font-weight:600}
.hero .gear{position:absolute!important;z-index:2;top:14px;right:14px;background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.14);color:#fff}
.dial{position:absolute!important;right:16px;bottom:22px;width:98px;height:98px}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:700 21px/1 Unbounded,sans-serif}
.dial .val small{display:block;font:600 11px/1.2 Manrope;color:rgba(255,255,255,.7);margin-top:4px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--slab);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:left}
.stat .si{display:block;width:20px;height:20px;color:var(--acc2);margin-bottom:8px}
.stat .si svg{width:20px;height:20px}
.stat b{display:block;font:700 18px/1.2 Unbounded,sans-serif;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12.5px;color:var(--mut);font-weight:600}

.card{background:var(--slab);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 16px;margin-bottom:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.card h2{font:800 16px/1.2 Manrope,sans-serif;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.card h2 .mut{font-weight:600}
.card h2 a{margin-left:auto;font-size:13px;color:var(--acc2);text-decoration:none;font-weight:700}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
.empty button{color:var(--acc2);font-weight:700}

/* строки дел и событий */
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.card h2+.item,.dayhdr+.item,.card>div>.item:first-child,.secthd+.item,.secthd+.todo,.card h2+.todo,.card>.todo:first-child{border-top:0}
.item .t{flex:1;min-width:0}
.item .t .ttl{font-weight:600;overflow-wrap:anywhere}
.item .t .sub{font-size:12.5px;color:var(--mut);margin-top:1px}
.item.done .ttl{color:var(--mut);text-decoration:line-through}
.chk{width:26px;height:26px;border-radius:9px;border:2px solid var(--dim);flex:none;display:grid;place-items:center;transition:background .15s,border-color .15s}
.chk svg{width:16px;height:16px;opacity:0;transform:scale(.4);transition:.18s}
.item.done .chk{background:var(--acc);border-color:var(--acc)}
.item.done .chk svg{opacity:1;transform:none}
.time{flex:none;min-width:56px;height:28px;border-radius:9px;background:var(--acc-soft);color:var(--acc2);font-weight:800;font-size:13px;display:grid;place-items:center;padding:0 7px}
.time.hab{background:rgba(61,220,151,.14);color:#9ff0c8}
.prio{width:8px;height:8px;border-radius:50%;flex:none}
.bell{width:15px;height:15px;color:var(--mut);vertical-align:-2px}

/* быстрая мысль / поле с кнопкой */
.quick{display:flex;gap:8px;align-items:flex-end}
.quick textarea{flex:1;min-height:46px;max-height:140px;resize:none;border-radius:14px;background:var(--slab2);border:1px solid var(--line);padding:12px;outline:none}
.quick textarea:focus,.quick input:focus{border-color:var(--acc)}
.quick button{height:46px;width:46px;border-radius:14px;background:var(--acc-grad);color:#fff;display:grid;place-items:center;flex:none}
.quick button svg{width:20px;height:20px}
.quick input{flex:1;min-width:0;height:46px;border-radius:14px;background:var(--slab2);border:1px solid var(--line);padding:0 14px;outline:none}

/* мысли */
.search{width:100%;height:44px;border-radius:14px;background:var(--slab);border:1px solid var(--line);padding:0 14px;outline:none;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;height:32px;padding:0 12px;border-radius:999px;background:var(--slab);border:1px solid var(--line);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--acc-grad);color:#fff;border-color:transparent}
.thought{background:var(--slab);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:6px 18px 18px 6px;padding:12px 12px 10px 14px;margin-bottom:8px}
.thought.pin{border-left-color:var(--amber);background:linear-gradient(90deg,rgba(255,189,74,.08),transparent 50%),var(--slab)}
.thought p{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.thought .tag{color:var(--acc2);font-weight:700}
.thought .meta{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--mut)}
.thought .meta button{width:32px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--mut)}
.thought .meta button svg{width:17px;height:17px}
.thought.pin .meta .pinb{color:var(--amber)}

/* привычки */
.habit{background:var(--slab);border:1px solid var(--line);border-radius:var(--r-card);padding:12px 14px 10px;margin-bottom:8px}
.habit .hn{display:flex;align-items:center;gap:12px;min-width:0;text-align:left;width:100%}
.hdots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.hd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--mut);font-weight:700}
.hd.today{color:var(--acc2)}
.habit .em{font-size:22px;width:38px;height:38px;border-radius:12px;background:var(--slab2);display:grid;place-items:center;flex:none}
.habit .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.habit .st{font-size:12px;color:var(--mut);font-weight:600}
.habit .st b{color:var(--green)}
.dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--dim);justify-self:center;transition:.15s}
.dot.on{background:var(--acc-grad);border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.dot.today{border-color:var(--acc2)}
.hchips{display:flex;flex-wrap:wrap;gap:6px}
.hchip{height:38px;padding:0 12px 0 8px;border-radius:12px;background:var(--slab2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.hchip.on{background:var(--acc-soft);border-color:var(--acc);color:var(--tx)}

/* календарь */
.cal{background:var(--slab);border:1px solid var(--line);border-radius:22px;padding:12px 10px 10px;margin-bottom:12px}
.calhead{display:flex;align-items:center;padding:0 6px 8px}
.calhead .disp{font-size:17px;font-weight:700;flex:1;text-transform:capitalize}
.calhead button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--tx)}
.calhead button svg{width:20px;height:20px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wdn{font-size:11.5px;text-align:center;color:var(--mut);font-weight:700;padding:4px 0}
.day{aspect-ratio:1/1;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:15px;position:relative}
.day.out{color:var(--dim)}
.day.today{color:var(--acc2)}
.day.sel{background:var(--acc-grad);color:#fff;box-shadow:0 6px 16px var(--acc-soft)}
.day .dots{display:flex;gap:3px;height:5px;margin-top:3px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--acc)}
.day .dots i.tk{background:var(--mut)}
.day.sel .dots i{background:#fff}
.seg{display:flex;background:var(--slab);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg label{flex:1}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:8px 6px;border-radius:10px;font-weight:700;font-size:14px;color:var(--mut)}
.seg input:checked+span{background:var(--acc-soft);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.seg input:focus-visible+span{outline:2px solid var(--acc)}

/* финансы */
.money-top{position:relative;overflow:hidden;border-radius:22px;padding:16px;margin-bottom:12px;border:1px solid var(--line);
  background:linear-gradient(150deg,var(--slab-hi),var(--slab) 70%)}
.money-top>*:not(.spark){position:relative}
.spark{position:absolute;right:0;bottom:0;width:58%;height:84px;pointer-events:none;opacity:.95}
.mswitch{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.mswitch .disp{font-size:15px;flex:1;text-transform:capitalize}
.mswitch button{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--tx)}
.mswitch button svg{width:18px;height:18px}
.bal{font:700 34px/1.1 Unbounded,sans-serif;letter-spacing:-.02em}
.bal.neg{color:var(--red)}
.io{display:flex;gap:18px;margin-top:10px;font-weight:700;font-size:14px}
.io .in{color:var(--green)} .io .out{color:#ff8f9a}
.bars .b{margin:10px 0}
.bars .bl{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:6px}
.bars .bt{height:8px;border-radius:5px;background:var(--slab2);overflow:hidden}
.bars .bt i{display:block;height:100%;border-radius:5px;background:var(--acc-grad)}
.dayhdr{font-size:13px;color:var(--mut);font-weight:700;margin:12px 2px 4px}
.op .ic{width:38px;height:38px;border-radius:12px;background:var(--slab2);display:grid;place-items:center;font-size:18px;flex:none}
.op .sum{font-weight:700;white-space:nowrap}
.op .sum.in{color:var(--green)}

/* таббар */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 10px calc(var(--safe-b) + 8px);
  background:var(--tabbg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabs nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:700;color:var(--mut);border-radius:12px}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--acc2)}
.tab.on svg{color:var(--acc)}

/* шторка */
.sheet-wrap{position:fixed;inset:0;z-index:50;pointer-events:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .22s}
.sheet{visibility:hidden;position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:90vh;overflow:auto;background:var(--sheet);border-radius:var(--r-sheet) var(--r-sheet) 0 0;border:1px solid var(--line);border-bottom:0;
  padding:8px 18px calc(var(--safe-b) + 18px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
.sheet-wrap.open{pointer-events:auto}
.sheet-wrap.open .backdrop{opacity:1}
.sheet-wrap.open .sheet{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--dim);margin:4px auto 12px}
.sheet h3{font:700 20px/1.2 Unbounded,sans-serif;margin:0 0 14px}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:13px;color:var(--mut);font-weight:700;margin-bottom:6px}
.inp{width:100%;height:48px;border-radius:14px;background:var(--slab2);border:1px solid var(--line);padding:0 14px;outline:none}
textarea.inp{height:auto;min-height:90px;padding:12px 14px;resize:vertical}
.inp:focus{border-color:var(--acc)}
.inp.big{font:700 26px/1 Unbounded,sans-serif;height:60px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{position:relative}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick span{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:12px;background:var(--slab2);border:1px solid var(--line);font-weight:600;font-size:14px}
.pick input:checked+span{background:var(--acc-soft);border-color:var(--acc);color:var(--tx)}
.pick input:focus-visible+span{outline:2px solid var(--acc)}
.pick.emo span{width:46px;justify-content:center;font-size:22px;padding:0}
.btn{width:100%;height:52px;border-radius:16px;background:var(--acc-grad);color:#fff;font-weight:800;font-size:16px;margin-top:6px}
.btn.ghost{background:transparent;color:var(--red);height:46px;margin-top:4px}
.btn.ghost.sure{background:rgba(255,107,122,.14)}
.btn.sec{background:var(--slab2);color:var(--tx)}
.hint{font-size:12.5px;color:var(--mut);margin:-4px 0 12px}

.scopebar{margin:0 0 14px}
.chk.round{border-radius:50%}
.item.shop.done .chk{background:var(--green);border-color:var(--green)}
.item .x,.todo .x{width:34px;height:34px;border-radius:10px;color:var(--mut);display:grid;place-items:center;flex:none}
.item .x svg,.todo .x svg{width:16px;height:16px}
.zic{width:38px;height:38px;border-radius:12px;background:#f6c344;color:#3a2a00;display:grid;place-items:center;font:700 17px/1 Unbounded,sans-serif;flex:none}
.zen .t{min-width:0}
.zen .sub{font-size:12.5px}
.spin svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.zen ol{margin:0 0 12px;padding-left:20px}.zen ol li{margin:6px 0}
.sheet ol{margin:0 0 12px;padding-left:20px;color:var(--tx)}.sheet ol li{margin:6px 0}
.sheet a{color:var(--acc2);font-weight:700}
.sw{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:14px;background:var(--slab2);border:1px solid var(--line);font-weight:600}
.sw input{width:20px;height:20px;accent-color:var(--acc);margin:0}
.members{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.locked{text-align:center;padding:60px 20px}
.locked h1{font:700 22px/1.2 Unbounded,sans-serif;margin:0 0 12px}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 90px);transform:translate(-50%,20px);opacity:0;z-index:60;
  background:var(--tx);color:var(--ink);border-radius:14px;padding:10px 10px 10px 14px;font-weight:700;display:flex;align-items:center;gap:12px;transition:.2s;pointer-events:none;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--acc);font-weight:800;padding:4px 8px}

/* ===== План как в Todoist ===== */
.ptabs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 2px;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptab{flex:none;height:38px;padding:0 13px;border-radius:13px;background:var(--slab);border:1px solid var(--line);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;color:var(--mut)}
.ptab svg{width:17px;height:17px}
.ptab.on{background:var(--acc-soft);border-color:var(--acc);color:var(--tx)}
.ptab.on svg{color:var(--acc2)}
.ptab .n{font-size:12px;font-weight:800;color:var(--acc2)}

<script>
/* ============ Telegram ============ */
const tg = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined) ? window.Telegram.WebApp : null;
const inTG = !!(tg && tg.initData);
if (tg) {
  try { tg.ready(); tg.expand(); } catch (e) {}
  try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
}
const hap = (k) => { try {
  if (!inTG) return;
  if (k === 'ok') tg.HapticFeedback.notificationOccurred('success');
  else if (k === 'sel') tg.HapticFeedback.selectionChanged();
  else tg.HapticFeedback.impactOccurred(k || 'light');
} catch (e) {} };

/* ============ Темы ============ */
const THEMES = [['violet', 'Фиолетовая', ['#8b6cff', '#3a2d7a', '#16132c']], ['man', 'Мужская', ['#3d8bff', '#1c3a66', '#0f1722']], ['woman', 'Женская', ['#ff5fa8', '#7a2a62', '#210f1b']]];
const INK = { violet: '#0c0a1a', man: '#080c12', woman: '#14090f' };
function applyTheme(t) {
  if (!INK[t]) t = 'violet';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('myday_theme', t); } catch (e) {}
  try { if (tg) { tg.setHeaderColor(INK[t]); tg.setBackgroundColor(INK[t]); } } catch (e) {}
}
const curTheme = () => document.documentElement.dataset.theme || 'violet';
applyTheme(curTheme());

/* ============ Утилиты ============ */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => ymd(new Date());
const MON = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MON_G = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MON_S = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const WD = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const WD_S = ['вс','пн','вт','ср','чт','пт','сб'];
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return (m10 === 1 && m100 !== 11) ? a : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) ? b : c; };
const money = (n) => Math.round(n).toLocaleString('ru-RU').replace(/ /g, ' ') + ' ' + PERS().currency;
const dayLabel = (s) => {
  const t = today();
  if (s === t) return 'Сегодня';
  if (s === ymd(addDays(new Date(), 1))) return 'Завтра';
  if (s === ymd(addDays(new Date(), -1))) return 'Вчера';
  const d = parseYmd(s);
  return `${d.getDate()} ${MON_G[d.getMonth()]}, ${WD_S[d.getDay()]}`;
};
const ago = (ts) => {
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return 'только что';
  if (m < 60) return `${m} мин назад`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} ${plural(h, 'час', 'часа', 'часов')} назад`;
  return dayLabel(ymd(new Date(ts)));
};

const I = {
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M9 10.8V4h6v6.8l3 3.2H6z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  bell: '<svg class="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>'
};

/* ============ Хранилище ============
   В Telegram — облако Telegram (CloudStorage, привязано к аккаунту, работает на всех устройствах).
   Вне Telegram — память браузера. Позже заменим на свой сервер. */
const KEY = 'myday_v1', CHUNK = 3800;
const cloudOK = () => { try { return inTG && tg.CloudStorage && tg.isVersionAtLeast('6.9'); } catch (e) { return false; } };
const Store = {
  local() { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } },
  load() {
    return new Promise((res) => {
      if (!cloudOK()) return res(this.local());
      tg.CloudStorage.getItem('n', (err, n) => {
        n = parseInt(n || '0', 10);
        if (err || !n) return res(this.local());
        const keys = Array.from({ length: n }, (_, i) => 'd' + i);
        tg.CloudStorage.getItems(keys, (e2, vals) => {
          if (e2 || !vals) return res(this.local());
          try { res(JSON.parse(keys.map(k => vals[k] || '').join(''))); } catch (e) { res(this.local()); }
        });
      });
    });
  },
  write(obj) {
    const s = JSON.stringify(obj);
    try { localStorage.setItem(KEY, s); } catch (e) {}
    if (cloudOK()) {
      const parts = [];
      for (let i = 0; i < s.length; i += CHUNK) parts.push(s.slice(i, i + CHUNK));
      let left = parts.length;
      parts.forEach((p, i) => tg.CloudStorage.setItem('d' + i, p, () => { if (--left === 0) tg.CloudStorage.setItem('n', String(parts.length)); }));
    }
  }
};
let saveT;
const save = () => { clearTimeout(saveT); saveT = setTimeout(() => Store.write(S), 300); };

/* ============ Сервер (Cloudflare) ============
   Если мини-апп открыт с нашего сервера, данные хранятся там:
   личные и общий семейный раздел. Иначе — как раньше, локально. */
let MODE = 'local', SCOPE = 'personal', SRV = null;
const PERS = () => (MODE === 'server' ? SRV.personal : S);
const COLS = ['thoughts', 'habits', 'money', 'tasks', 'events', 'shop', 'projects'];
const emptyS = () => ({ v: 1, name: '', currency: '₽', thoughts: [], habits: [], money: [], tasks: [], events: [], shop: [], projects: [] });
const isEmptyS = (st) => !st || COLS.every(c => !st[c] || !st[c].length);
async function api(action, body = {}) {
  const r = await fetch('api/' + action, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ initData: tg ? tg.initData : '', ...body }) });
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!j) throw new Error('HTTP ' + r.status);
  return j;
}
function applyServer(r) {
  SRV = r;
  if (r.me && r.me.theme && r.me.theme !== curTheme()) applyTheme(r.me.theme);
  for (const k of ['personal', 'family']) SRV[k] = Object.assign(emptyS(), SRV[k] || {});
  if (!SRV.personal.name) SRV.personal.name = r.me.name;
  S = SRV[SCOPE];
}
function setScopeState(st) { S = st; if (MODE === 'server') SRV[SCOPE] = st; }
const PKEY = 'myday_pending';
let pending = (() => { try { return JSON.parse(localStorage.getItem(PKEY)) || []; } catch (e) { return []; } })();
const savePending = () => { try { localStorage.setItem(PKEY, JSON.stringify(pending)); } catch (e) {} };
function persist(ops, scope = SCOPE) {
  if (MODE !== 'server') { save(); return; }
  if (!ops.length) return;
  pending.push({ scope, ops }); savePending(); flush();
}
let flushing = false, warned = false;
async function flush() {
  if (flushing || !pending.length) return;
  flushing = true;
  try {
    while (pending.length) {
      const r = await api('ops', pending[0]);
      if (!r.ok) throw new Error(r.error);
      pending.shift(); savePending();
    }
    warned = false;
  } catch (e) {
    if (!warned) { toast('Нет связи с сервером. Изменения сохранятся, когда связь появится.'); warned = true; }
    setTimeout(flush, 8000);
  } finally { flushing = false; }
}
async function refresh() {
  if (MODE !== 'server' || pending.length || flushing || document.hidden || $('#sheetWrap').classList.contains('open')) return;
  const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  try {
    const r = await api('load');
    if (!r.ok || pending.length) return;
    if (JSON.stringify([SRV.personal, SRV.family, SRV.members]) === JSON.stringify([Object.assign(emptyS(), r.personal, { name: r.personal.name || r.me.name }), Object.assign(emptyS(), r.family), r.members])) return;
    applyServer(r); render();
  } catch (e) {}
}
let refreshN = 0;
setInterval(() => { refreshN++; if (UI.view === 'shop' || refreshN % 3 === 0) refresh(); }, 10000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
const scopeBar = () => MODE !== 'server' ? '' : `
  <div class="seg scopebar" role="radiogroup" aria-label="Раздел">
    <label><input type="radio" name="scope" value="personal" ${SCOPE === 'personal' ? 'checked' : ''}><span>Личное</span></label>
    <label><input type="radio" name="scope" value="family" ${SCOPE === 'family' ? 'checked' : ''}><span>Семья${SRV.members.length > 1 ? ' · ' + SRV.members.length : ''}</span></label>
  </div>
  ${SCOPE === 'family' && SRV.members.length < 2 ? `<p class="hint" style="margin:-6px 2px 12px">Здесь общие дела, события и расходы семьи. Пригласи близких: ⚙️ на главной, «Пригласить в семью».</p>` : ''}`;


/* ============ Данные ============ */
const CATS = {
  out: [['Продукты','🛒'],['Кафе','☕'],['Транспорт','⛽'],['Дом','🏠'],['Связь','📱'],['Здоровье','💊'],['Покупки','🛍️'],['Отдых','🎮'],['Работа','🧰'],['Другое','📦']],

function moneySpark(mk) {
  const [y, m] = mk.split('-').map(Number), dim = new Date(y, m, 0).getDate(), T = today();
  const last = mk === T.slice(0, 7) ? +T.slice(8) : mk < T.slice(0, 7) ? dim : 0;
  if (last < 2) return '';
  const byDay = {}; for (const o of S.money) if (o.date && o.date.startsWith(mk)) byDay[o.date] = (byDay[o.date] || 0) + (o.type === 'in' ? o.amount : -o.amount);
  let bal = 0; const pts = [0];
  for (let d = 1; d <= last; d++) { bal += byDay[`${mk}-${pad(d)}`] || 0; pts.push(bal); }
  const mn = Math.min(...pts), mx = Math.max(...pts); if (mx === mn) return '';
  const n = pts.length - 1, X = (i) => +(i / n * 100).toFixed(2), Y = (v) => +(40 - (v - mn) / (mx - mn) * 30).toFixed(2);
  let line = `M${X(0)} ${Y(pts[0])}`;
  for (let i = 1; i <= n; i++) { const xm = (X(i - 1) + X(i)) / 2; line += ` C${xm} ${Y(pts[i - 1])} ${xm} ${Y(pts[i])} ${X(i)} ${Y(pts[i])}`; }
  return `<svg class="spark" viewBox="0 0 100 44" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--acc);stop-opacity:.45"/><stop offset="1" style="stop-color:var(--acc);stop-opacity:0"/></linearGradient></defs>
    <path d="${line} L100 44 L0 44Z" fill="url(#sg)"/>
    <path d="${line}" fill="none" style="stroke:var(--acc2)" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

let toastT, undoFn = null;
function toast(text, undo) {
  $('#toastTx').textContent = text; undoFn = undo || null;

const WD_LIST = '(?:понедельник\\S*|вторник\\S*|сред[уаы]|средам|четверг\\S*|пятниц\\S*|суббот\\S*|воскресень\\S*|пн|вт|ср|чт|пт|сб|вс)';

  for (let i = 0; i < 7; i++) if (w === m[i][0] || w.startsWith(m[i][1])) return i;

const MON_RE = '(январ\\S*|феврал\\S*|март\\S*|апрел\\S*|ма[яй]|июн\\S*|июл\\S*|август\\S*|сентябр\\S*|октябр\\S*|ноябр\\S*|декабр\\S*)';
const monIndex = (w) => ['январ', 'феврал', 'март', 'апрел', 'ма', 'июн', 'июл', 'август', 'сентябр', 'октябр', 'ноябр', 'декабр'].findIndex(p => w.toLowerCase().startsWith(p));

// Разбор фразы быстрого добавления: «Позвонить маме завтра в 18 p1 #Семья @звонки каждый пн»
function parseQuick(raw, T = today()) {
  let s = ' ' + String(raw || '') + ' ';
  const r = { labels: [] };

  const take = (re, fn) => { const m = s.match(re); if (!m) return false; if (fn(m) === false) return false; s = s.slice(0, m.index) + ' ' + s.slice(m.index + m[0].length); return true; };

  let guard = 0;
  while (guard++ < 10 && take(/\s@([\p{L}\p{N}_\-]+)/u, m => { r.labels.push(m[1]); }));
  const recs = [['(каждый день|ежедневно)', 'day'], ['(по будням|каждый будний день|в будни)', 'weekdays'], ['(каждую неделю|еженедельно)', 'week'], ['(каждый месяц|ежемесячно)', 'month'], ['(каждый год|ежегодно)', 'year']];

  if (!r.rec) take(new RegExp('\\s(?:кажд(?:ый|ую|ое)|по)\\s+(' + WD_LIST + '(?:\\s*(?:,|\\sи\\s)\\s*' + WD_LIST + ')*)' + E, 'i'), m => {
    const ds = m[1].split(/\s*(?:,|\sи\s)\s*/i).map(wdIndex).filter(x => x >= 0);
    if (!ds.length) return false;
    r.rec = 'wday:' + [...new Set(ds)].sort().join(',');
  });
  take(new RegExp('\\s(?:в|к)\\s+(\\d{1,2})(?:[:.](\\d{2}))?(?:\\s*(?:ч|час|часа|часов))?(?:\\s+(утра|дня|вечера|ночи))?' + E, 'i'), m => {
    let h = +m[1]; const mi = +(m[2] || 0);
    if (h > 23 || mi > 59) return false;
    if ((m[3] === 'вечера' || m[3] === 'дня') && h < 12) h += 12;
    if (m[3] === 'ночи' && h === 12) h = 0;
    r.time = pad(h) + ':' + pad(mi);
  }) || take(new RegExp('\\s(\\d{1,2}):(\\d{2})' + E), m => { const h = +m[1], mi = +m[2]; if (h > 23 || mi > 59) return false; r.time = pad(h) + ':' + pad(mi); })
    || take(new RegExp('\\sв\\s+полдень' + E, 'i'), () => { r.time = '12:00'; });
  const dateRules = [
    [/\sпослезавтра/i, () => ymdAdd(T, 2)], [/\sзавтра/i, () => ymdAdd(T, 1)], [/\sсегодня/i, () => T],
    [/\sна выходных/i, () => nextWd(T, 6, true)], [/\sна следующей неделе/i, () => nextWd(T, 1, false)],
    [/\sчерез\s+(\d+\s+)?(дн\S*|день|недел\S*|месяц\S*|год\S*)/i, m => {
      const n = +(m[1] || 1), u = m[2].toLowerCase();
      if (u.startsWith('нед')) return ymdAdd(T, 7 * n);
      if (u.startsWith('мес')) { const d = parseYmd(T); d.setMonth(d.getMonth() + n); return ymd(d); }
      if (u.startsWith('год')) { const d = parseYmd(T); d.setFullYear(d.getFullYear() + n); return ymd(d); }

    }],
    [new RegExp('\\s(\\d{1,2})\\s+' + MON_RE, 'i'), m => {

  r.title = title ? title.charAt(0).toUpperCase() + title.slice(1) : '';

}

// Повторы
function stepRec(x, rec, base) {
  const [k, v] = String(rec).split(':'); const n = Math.max(1, +v || 1); const D = parseYmd(x);
  const monthStep = (m) => { const bd = +String(base || x).slice(8, 10); const d = new Date(D.getFullYear(), D.getMonth() + m, 1); const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(bd, dim)); return ymd(d); };
  switch (k) {
    case 'day': return ymdAdd(x, 1);
    case 'days': return ymdAdd(x, n);
    case 'weekdays': { let y = ymdAdd(x, 1); while ([0, 6].includes(parseYmd(y).getDay())) y = ymdAdd(y, 1); return y; }
    case 'week': return ymdAdd(x, 7);
    case 'week2': return ymdAdd(x, 14);
    case 'weeks': return ymdAdd(x, 7 * n);
    case 'month': return monthStep(1);
    case 'months': return monthStep(n);
    case 'year': return monthStep(12);
    case 'wday': { const set = String(v).split(',').map(Number); let y = ymdAdd(x, 1); for (let i = 0; i < 8 && !set.includes(parseYmd(y).getDay()); i++) y = ymdAdd(y, 1); return y; }
  }
  return ymdAdd(x, 1);
}
function nextDue(d, rec, base) { const T = today(); let x = d, i = 0; do { x = stepRec(x, rec, base || d); } while (x <= T && i++ < 3000); return x; }
const REC_OPTS = [['', 'Не повторять'], ['day', 'Каждый день'], ['weekdays', 'По будням'], ['week', 'Каждую неделю'], ['week2', 'Каждые 2 недели'], ['month', 'Каждый месяц'], ['year', 'Каждый год']];
function recLabel(rec) {
  if (!rec) return '';
  const o = REC_OPTS.find(([k]) => k === rec); if (o) return o[1].toLowerCase();
  const [k, v] = rec.split(':');
  if (k === 'wday') return 'каждый ' + v.split(',').map(Number).sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(i => WD_SHORT[i]).join(', ');
  if (k === 'days') return `каждые ${v} ${plural(+v, 'день', 'дня', 'дней')}`;
  if (k === 'weeks') return `каждые ${v} ${plural(+v, 'неделю', 'недели', 'недель')}`;
  if (k === 'months') return `каждые ${v} ${plural(+v, 'месяц', 'месяца', 'месяцев')}`;
  return '';
}

// Подпись срока как в Todoist
function dueInfo(d, time) {
  const T = today(), diff = Math.round((parseYmd(d) - parseYmd(T)) / 864e5), D = parseYmd(d);
  let txt, cls = '';
  if (diff < 0) { txt = diff === -1 ? 'Вчера' : `${D.getDate()} ${MON_S[D.getMonth()]}`; cls = 'over'; }
  else if (diff === 0) { txt = 'Сегодня'; cls = 'today'; }
  else if (diff === 1) { txt = 'Завтра'; cls = 'tom'; }
  else if (diff < 7) { txt = WD[D.getDay()].charAt(0).toUpperCase() + WD[D.getDay()].slice(1); cls = 'week'; }
  else txt = `${D.getDate()} ${MON_S[D.getMonth()]}${D.getFullYear() !== new Date().getFullYear() ? ' ' + D.getFullYear() : ''}`;
  return { txt: txt + (time ? ' ' + time : ''), cls };
}

      + planList(S.tasks.filter(t => t.proj === p.id), { key: 'p' + p.id, hideProj: true, attrs: `data-proj="${p.id}" data-date=""`, empty: 'В проекте пока нет задач.' });
  }
  return head + planToday();
};

function planToday() {
  const T = today(), D = new Date();
  const open = S.tasks.filter(t => !t.done);
  const over = open.filter(t => t.date && t.date < T).sort(sortTasks);
  const tod = open.filter(t => t.date === T);
  const ev = S.events.filter(e => e.date === T);
  const done = S.tasks.filter(t => t.done && (t.date === T || (t.doneAt && ymd(new Date(t.doneAt)) === T)));
  const rows = [...ev.map(e => [e.time || '00:00', 0, eventRow(e)]), ...tod.map(t => [t.time || '99:99', PR(t), todoRow(t, { ctx: 'today' })])]
    .sort((a, b) => a[0].localeCompare(b[0]) || a[1] - b[1]).map(x => x[2]).join('');
  return `
  ${over.length ? `<section class="card"><div class="secthd over"><span>Просрочено</span><button data-act="moveOverdue">Перенести на сегодня</button></div>${over.map(t => todoRow(t)).join('')}</section>` : ''}
  <section class="card"><div class="secthd"><span>Сегодня <span class="mut">${WD_S[D.getDay()]}, ${D.getDate()} ${MON_S[D.getMonth()]}</span></span></div>
    ${rows}${addRow(`data-date="${T}"`)}${doneBlock(done, 'today')}
    ${!over.length && !tod.length && !ev.length ? emptyArt(done.length ? 'Всё на сегодня сделано. Отличный день!' : 'На сегодня задач нет. Добавь первую или загляни в «Предстоящее».') : ''}
  </section>
  ${calCard()}`;
}

function planUpcoming() {
  if (!UI.planMonth) { const s = parseYmd(UI.selDay); UI.planMonth = new Date(s.getFullYear(), s.getMonth(), 1); }
  const pm = UI.planMonth, y = pm.getFullYear(), m = pm.getMonth();
  const off = (new Date(y, m, 1).getDay() + 6) % 7, dim = new Date(y, m + 1, 0).getDate(), T = today();
  let cells = '';
  for (let i = 0; i < off; i++) { const d = new Date(y, m, i - off + 1); cells += `<button class="day out" data-act="selDay" data-day="${ymd(d)}">${d.getDate()}<span class="dots"></span></button>`; }
  for (let i = 1; i <= dim; i++) {
    const k = `${y}-${pad(m + 1)}-${pad(i)}`;
    const ne = S.events.some(e => e.date === k), nt = S.tasks.some(x => x.date === k && !x.done);
    cells += `<button class="day ${k === T ? 'today' : ''} ${k === UI.selDay ? 'sel' : ''}" data-act="selDay" data-day="${k}" aria-label="${i} ${MON_G[m]}">${i}<span class="dots">${ne ? '<i></i>' : ''}${nt ? '<i class="tk"></i>' : ''}</span></button>`;
  }
  const dayBlock = (d, withAdd) => {
    const ev = S.events.filter(e => e.date === d), tk = S.tasks.filter(x => x.date === d && !x.done);
    const rows = [...ev.map(e => [e.time || '00:00', 0, eventRow(e)]), ...tk.map(t => [t.time || '99:99', PR(t), todoRow(t, { ctx: 'today' })])].sort((a, b) => a[0].localeCompare(b[0]) || a[1] - b[1]).map(x => x[2]).join('');
    return { rows, n: ev.length + tk.length, add: withAdd ? addRow(`data-date="${d}"`) : '' };
  };
  const sd = UI.selDay, cur = dayBlock(sd, true);
  let next = '';
  for (let i = 1; i <= 7; i++) {
    const d = ymdAdd(sd, i), b = dayBlock(d, false);
    if (b.n) next += `<div class="dayhdr">${dayLabel(d)}</div>${b.rows}`;
  }
  return `
  <section class="cal">
    <div class="calhead"><span class="disp">${MON[m]} ${y}</span>
      <button data-act="calPrev" aria-label="Предыдущий месяц">${I.left}</button>
      <button data-act="calNext" aria-label="Следующий месяц">${I.right}</button></div>
    <div class="grid7">${['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].map(w => `<div class="wdn">${w}</div>`).join('')}${cells}</div>
  </section>
  <section class="card"><div class="secthd"><span>${dayLabel(sd)}</span>${sd !== T ? `<button data-act="selDay" data-day="${T}">К сегодня</button>` : ''}</div>
    ${cur.rows}${cur.add}</section>
  ${next ? `<section class="card"><div class="secthd"><span>Дальше</span></div>${next}</section>` : ''}
  ${calCard()}`;
}

function planList(all, o) {
  const open = all.filter(t => !t.done).sort(sortTasks);
  const done = all.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0)).slice(0, 40);
  return `<section class="card">${open.map(t => todoRow(t, { hideProj: o.hideProj })).join('')}${addRow(o.attrs)}
    ${!open.length ? emptyArt(o.empty) : ''}${doneBlock(done, o.key)}</section>`;
}

function planProjects() {
  const ps = projList(), open = S.tasks.filter(t => !t.done);
  return `<section class="card">
    <button class="prow" data-act="ptab" data-tab="inbox">${IC.inbox.replace('<svg', '<svg style="color:var(--acc2)"')}<span class="sp">Входящие</span><span class="mut">${open.filter(t => !t.proj).length || ''}</span>${I.right}</button>
    ${ps.map(p => `<button class="prow" data-act="ptab" data-tab="proj:${p.id}"><i style="background:${p.color}"></i><span class="sp">${esc(p.name)}</span><span class="mut">${open.filter(t => t.proj === p.id).length || ''}</span>${I.right}</button>`).join('')}
    <button class="addrow" data-act="projNew"><span class="plus">${I.plus}</span>Новый проект</button>
  </section>
  ${!ps.length ? '<p class="hint" style="margin:0 4px">Проекты помогают разложить задачи по сферам: «Работа», «Дом», «Ремонт гаража». В быстром добавлении можно написать #Проект.</p>' : ''}`;
}

function quickMerged(f) {
  const r = parseQuick(f.text.value);
  const md = f.mdate.value, def = f.dataset.defDate;
  const date = md === '-' ? '' : md || r.date || def || '';
  const p = +f.mp.value || r.p || 4;
  let projId = f.projSel.dataset.touched ? f.projSel.value : '', projNew = '';
  if (!f.projSel.dataset.touched) {
    if (r.proj) { const ex = projList().find(x => x.name.toLowerCase() === r.proj.toLowerCase()); if (ex) projId = ex.id; else projNew = r.proj; }
    else projId = f.dataset.defProj || '';
  }
  return { ...r, date, p, projId, projNew, time: date ? r.time : '' };
}
function updQA(f) {
  const m = quickMerged(f), chips = [];
  if (m.date) { const d = dueInfo(m.date, m.time); chips.push(`<span class="qchip">${IC.cal}${d.txt}</span>`); }
  if (m.rec) chips.push(`<span class="qchip">${IC.rep}${recLabel(m.rec)}</span>`);
  if (m.p < 4) chips.push(`<span class="qchip p${m.p}">${IC.flag}P${m.p}</span>`);
  const pj = m.projId && projById(m.projId);
  if (pj) chips.push(`<span class="qchip"><i style="background:${pj.color}"></i>${esc(pj.name)}</span>`);
  if (m.projNew) chips.push(`<span class="qchip">${IC.hash}${esc(m.projNew)} (новый)</span>`);
  for (const l of m.labels) chips.push(`<span class="qchip">${IC.tag}${esc(l)}</span>`);
  $('#qaPrev').innerHTML = chips.join('');
  f.querySelectorAll('[data-act=qaDate]').forEach(b => b.classList.toggle('on', f.mdate.value === b.dataset.v));
  f.querySelectorAll('[data-act=qaP]').forEach(b => b.classList.toggle('on', +f.mp.value === +b.dataset.v));
}

const subsHtml = (t) => (t.subs || []).map(s => `<div class="todo sub ${s.done ? 'done' : ''}">

    <button type="button" class="x" data-act="subDel" data-id="${t.id}" data-sid="${s.id}" aria-label="Удалить подзадачу">${XI}</button></div>`).join('');

        <button type="button" class="qbtn" data-act="tdDate" data-v="${nextWd(T, 1, false)}">След. неделя</button><button type="button" class="qbtn" data-act="tdDate" data-v="">Без срока</button></div></div>

F.proj = (p = {}) => `<h3>${p.id ? 'Проект' : 'Новый проект'}</h3>
  <form data-form="proj"><input type="hidden" name="id" value="${p.id || ''}">

    <div class="f"><span>Цвет</span><div class="swatches">${PCOL.map((c, i) => `<label><input type="radio" name="color" value="${c}" ${(p.color || PCOL[(projList().length + 5) % PCOL.length]) === c ? 'checked' : ''}><span style="background:${c}" aria-label="Цвет ${i + 1}"></span></label>`).join('')}</div></div>
    <button class="btn">Сохранить</button>
    ${p.id ? `<button type="button" class="btn ghost" data-act="projDel" data-id="${p.id}">Удалить проект</button><p class="hint" style="margin-top:6px">Задачи проекта при удалении переедут во «Входящие».</p>` : ''}
  </form>`;

/* ---------- Действия ---------- */
Object.assign(A, {
  ptab: (d) => { UI.ptab = d.tab; UI.showDone = ''; hap('sel'); render(); window.scrollTo(0, 0); },
  showDone: (d) => { UI.showDone = UI.showDone === d.k ? '' : d.k; render(); },
  newTask: (d = {}) => {
    const T = today();
    let date = d.date !== undefined ? d.date : (UI.view === 'plan' ? (UI.ptab === 'today' ? T : UI.ptab === 'upcoming' ? UI.selDay : '') : T);
    const proj = d.proj || (UI.view === 'plan' && UI.ptab.startsWith('proj:') ? UI.ptab.slice(5) : '');
    openSheet(F.quick({ date, proj }));
    const f = $('#sheetBody form'); f.text.focus(); updQA(f);
  },
  editTask: (d) => { const t = find('tasks', d.id); if (t) openSheet(F.task(t)); },
  toggleTask: (d) => {
    const t = find('tasks', d.id); if (!t) return;
    if (!t.done && t.rec && t.date) {
      t.date = nextDue(t.date, t.rec, t.recBase || t.date); (t.subs || []).forEach(s => { s.done = false; });
      t.streak = (t.streak || 0) + 1; hap('ok'); commit(['put', 'tasks', t]);
      toast('Готово. Следующий раз: ' + dayLabel(t.date).toLowerCase()); return;
    }
    t.done = !t.done; t.doneAt = t.done ? Date.now() : null;
    hap(t.done ? 'ok' : 'light'); commit(['put', 'tasks', t]);
    if (t.done) toast('Задача выполнена', () => { t.done = false; t.doneAt = null; return ['put', 'tasks', t]; });
  },
  moveOverdue: () => {
    const T = today(), ops = [];
    for (const t of S.tasks) if (!t.done && t.date && t.date < T) { t.date = T; ops.push(['put', 'tasks', t]); }
    hap('ok'); commit(...ops); toast(`Перенесено на сегодня: ${ops.length}`);
  },
  qaDate: (d) => { const f = $('#sheetBody form'); f.mdate.value = f.mdate.value === d.v ? '' : d.v; updQA(f); f.text.focus(); },
  qaP: (d) => { const f = $('#sheetBody form'); f.mp.value = f.mp.value === d.v ? '' : d.v; updQA(f); f.text.focus(); },
  tdDate: (d) => { const f = $('#sheetBody form'); f.date.value = d.v; if (!d.v) f.time.value = ''; },
  subToggle: (d) => { const t = find('tasks', d.id), s = t && (t.subs || []).find(x => x.id === d.sid); if (!s) return; s.done = !s.done; hap(s.done ? 'ok' : 'light'); persist([['put', 'tasks', t]]); $('#subs').innerHTML = subsHtml(t); render(); },
  subDel: (d) => { const t = find('tasks', d.id); if (!t) return; t.subs = (t.subs || []).filter(x => x.id !== d.sid); persist([['put', 'tasks', t]]); $('#subs').innerHTML = subsHtml(t); render(); },
  projNew: () => openSheet(F.proj()),
  projEdit: (d) => openSheet(F.proj(projById(d.id))),
  projDel: (d, el) => {
    if (!el.classList.contains('sure')) { el.classList.add('sure'); el.textContent = 'Нажми ещё раз, чтобы удалить'; return; }
    const ops = [];
    for (const t of S.tasks) if (t.proj === d.id) { t.proj = ''; ops.push(['put', 'tasks', t]); }
    S.projects = projList().filter(p => p.id !== d.id); ops.push(['del', 'projects', d.id]);
    UI.ptab = 'projects'; closeSheet(); commit(...ops); toast('Проект удалён');
  }
});

Object.assign(FORMS, {
  quick: (fd, f) => {
    const m = quickMerged(f);
    if (!m.title) { f.text.focus(); return; }
    const ops = [];
    let proj = m.projId;
    if (m.projNew) { const p = { id: uid(), name: capFirst(m.projNew).slice(0, 40), color: PCOL[(projList().length + 5) % PCOL.length] }; projList().push(p); ops.push(['put', 'projects', p]); proj = p.id; }
    const t = byMe({ id: uid(), title: m.title, desc: (fd.get('desc') || '').trim(), date: m.date, time: m.time || '', p: m.p, proj, labels: m.labels, rec: m.rec || '', recBase: m.rec ? m.date : '', remind: '0', done: false, ts: Date.now() });
    S.tasks.push(t); ops.push(['put', 'tasks', t]);
    hap('ok'); commit(...ops);
    const where = proj ? (projById(proj) || {}).name : 'Входящие';
    toast(`Добавлено${m.date ? ': ' + dueInfo(m.date, m.time).txt.toLowerCase() : ''} · ${where}`);
    f.text.value = ''; f.desc.value = ''; f.mdate.value = ''; f.mp.value = ''; updQA(f); f.text.focus();
  },
  task: (fd) => {
    const id = fd.get('id');
    const o = {
      title: fd.get('title').trim(), desc: (fd.get('desc') || '').trim(), date: fd.get('date') || '', time: fd.get('date') ? (fd.get('time') || '') : '',
      p: +fd.get('p') || 4, proj: fd.get('proj') || '', rec: fd.get('rec') || '',
      labels: String(fd.get('labels') || '').split(/[,\s]+/).map(x => x.replace(/^@/, '').trim()).filter(Boolean).slice(0, 10)
    };
    if (fd.has('remind')) o.remind = fd.get('remind');
    if (o.rec && !o.date) o.date = today();
    let it;
    if (id) { it = find('tasks', id); if (it.rec !== o.rec || it.date !== o.date) o.recBase = o.date; Object.assign(it, o); delete it.prio; }
    else S.tasks.push(it = byMe({ id: uid(), done: false, ts: Date.now(), recBase: o.date, ...o }));
    closeSheet(); hap('ok'); commit(['put', 'tasks', it]); toast(id ? 'Задача сохранена' : 'Задача добавлена');
  },
  proj: (fd) => {
    const id = fd.get('id'), o = { name: fd.get('name').trim().slice(0, 40), color: fd.get('color') || PCOL[6] };
    let p;
    if (id) p = Object.assign(projById(id), o); else { p = { id: uid(), ...o }; projList().push(p); UI.ptab = 'proj:' + p.id; }
    closeSheet(); hap('ok'); commit(['put', 'projects', p]); toast(id ? 'Проект сохранён' : 'Проект создан');
  }
});

document.addEventListener('input', (e) => { const f = e.target.closest && e.target.closest('[data-form=quick]'); if (f && e.target.name === 'text') updQA(f); });
document.addEventListener('change', (e) => { if (e.target.name === 'projSel') { e.target.dataset.touched = '1'; updQA(e.target.form); } });
document.addEventListener('keydown', (e) => {
  const el = e.target;
  if (e.key === 'Enter' && el.classList && el.classList.contains('subadd')) {
    e.preventDefault();
    const title = el.value.trim(); if (!title) return;
    const t = find('tasks', el.dataset.id); if (!t) return;
    t.subs = (t.subs || []).concat({ id: uid(), title: title.slice(0, 200), done: false });
    persist([['put', 'tasks', t]]); el.value = ''; $('#subs').innerHTML = subsHtml(t); render();
  }
});

/* ============ События ============ */
document.addEventListener('click', (e) => {
  const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  const tab = e.target.closest('.tab'); if (tab) { hap('sel'); go(tab.dataset.v); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.tagName === 'A') e.preventDefault();
  const fn = A[a.dataset.act]; if (fn) fn(a.dataset, a);
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target, h = FORMS[f.dataset.form]; if (h) h(new FormData(f), f);
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.input === 'thQ') { UI.thQ = t.value; $('#thList').innerHTML = thList(); }
  if (t.tagName === 'TEXTAREA' && t.closest('.quick')) { t.style.height = 'auto'; t.style.height = Math.min(140, t.scrollHeight) + 'px'; }
});
document.addEventListener('change', (e) => {
  if (e.target.name === 'type' && e.target.closest('[data-form=op]')) $('#catBox').innerHTML = catPick(e.target.value);
  if (e.target.name === 'scope' && MODE === 'server') { SCOPE = e.target.value; S = SRV[SCOPE]; hap('sel'); render(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeSheet();
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.closest('.quick')) e.target.form.requestSubmit();
});

/* ============ Навигация ============ */
const VIEWS = ['home', 'plan', 'thoughts', 'habits', 'money', 'shop'];
function go(v) { if (location.hash !== '#' + v) location.hash = v; else render(); }
function render() {
  const h = location.hash.slice(1);
  const v = VIEWS.includes(h) ? h : 'home';
  const changed = v !== UI.view; UI.view = v;
  const el = $('#view');
  el.innerHTML = `<div class="${changed ? 'view' : ''}">${v === 'shop' ? '' : scopeBar()}${V[v]()}</div>`;
  document.querySelectorAll('.tab').forEach(t => { t.classList.toggle('on', t.dataset.v === v); t.setAttribute('aria-current', t.dataset.v === v ? 'page' : 'false'); });
  if (changed) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);

/* ============ Старт ============ */
async function boot() {
  if (inTG) {
    try {
      const r = await api('load', { tz: Intl.DateTimeFormat().resolvedOptions().timeZone });
      if (r.ok) {
        MODE = 'server'; applyServer(r); UI.view = ''; render(); flush();
        let skip = false; try { skip = localStorage.getItem('myday_nomigrate') === '1'; } catch (e) {}
        const local = skip ? null : await Store.load();
        if (local && local.v && !isEmptyS(local) && isEmptyS(SRV.personal)) {
          window.__localData = local;
          const n = COLS.reduce((a, c) => a + (local[c] || []).length, 0);
          openSheet(`<h3>Перенести старые записи?</h3><p class="hint" style="margin-bottom:14px">В Telegram сохранено ${n} ${plural(n, 'запись', 'записи', 'записей')} из прошлой версии. Перенести их в твой личный раздел на сервере? Если это просто примеры, нажми «Не нужно».</p>
            <button class="btn" data-act="migrate">Перенести</button><button class="btn sec" data-act="skipMigrate">Не нужно</button>`);
        }
        return;
      }
      if (r.error === 'not_member') {
        document.querySelector('.tabs').classList.add('hidden');
        $('#view').innerHTML = `<div class="locked"><h1>Это семейное приложение</h1><p class="mut">Чтобы пользоваться им, попроси владельца прислать тебе ссылку-приглашение и открой её.</p></div>`;
        return;
      }
    } catch (e) { /* сервера нет — работаем локально */ }
  }
  const d = await Store.load();
  S = d && d.v ? d : demo();
  for (const c of COLS) if (!Array.isArray(S[c])) S[c] = [];
  if (!d) save();
  UI.view = '';
  render();
}
boot();
</script>
</body>
